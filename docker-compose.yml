services:
  web:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: .
    command: python bot.py
    env_file: .env
    environment:
      DB_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
